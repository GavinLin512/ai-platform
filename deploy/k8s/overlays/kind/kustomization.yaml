# A local cluster for practice: kubectl apply -k deploy/k8s/overlays/kind
# Walkthrough: docs/learning/06-kubernetes.md
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: l10n-review
resources:
  - namespace.yaml
  - ../../base
  - postgres.yaml
# The image you built and loaded into kind (kind load docker-image …), not the registry one.
images:
  - name: ghcr.io/gavinlin512/l10n-review-github-app
    newName: l10n-review-github-app
    newTag: dev
# Two replicas: the Postgres queue shares work between them, and the "stately" queue policy
# keeps them from reviewing the same commit at once.
replicas:
  - name: github-app
    count: 2
configMapGenerator:
  - name: github-app-config
    envs: [config.env] # copy config.env.example
secretGenerator:
  - name: github-app-secrets
    envs: [secrets.env] # copy secrets.env.example; gitignored
    files: [private-key.pem] # your GitHub App key, copied here; gitignored
  - name: postgres-credentials
    literals: [POSTGRES_USER=l10n, POSTGRES_PASSWORD=l10n, POSTGRES_DB=l10n]
